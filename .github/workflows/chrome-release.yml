name: Chrome Release

on:
  push:
    tags:
      - 'chrome-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Test Chrome packages
        run: bun run test:chrome

      - name: Build Chrome extension package
        run: |
          bun run --cwd apps/chrome/chrome-extension package
          cp apps/chrome/chrome-extension/clipmark-extension.zip .
          sha256sum clipmark-extension.zip > clipmark-extension.zip.sha256

      - name: Build native host artifacts
        run: |
          bun build apps/chrome/chrome-native-host/src/host.ts --compile --target=bun-darwin-arm64 --outfile plannotator-chrome-native-host-darwin-arm64
          sha256sum plannotator-chrome-native-host-darwin-arm64 > plannotator-chrome-native-host-darwin-arm64.sha256

          bun build apps/chrome/chrome-native-host/src/host.ts --compile --target=bun-darwin-x64 --outfile plannotator-chrome-native-host-darwin-x64
          sha256sum plannotator-chrome-native-host-darwin-x64 > plannotator-chrome-native-host-darwin-x64.sha256

          bun build apps/chrome/chrome-native-host/src/host.ts --compile --target=bun-linux-x64 --outfile plannotator-chrome-native-host-linux-x64
          sha256sum plannotator-chrome-native-host-linux-x64 > plannotator-chrome-native-host-linux-x64.sha256

          bun build apps/chrome/chrome-native-host/src/host.ts --compile --target=bun-linux-arm64 --outfile plannotator-chrome-native-host-linux-arm64
          sha256sum plannotator-chrome-native-host-linux-arm64 > plannotator-chrome-native-host-linux-arm64.sha256

          cp apps/chrome/chrome-native-host/install-release.sh install-chrome-native-host.sh
          sha256sum install-chrome-native-host.sh > install-chrome-native-host.sh.sha256

          cp apps/chrome/chrome-extension/install-release.sh install-chrome-extension.sh
          sha256sum install-chrome-extension.sh > install-chrome-extension.sh.sha256

          cp apps/chrome/install-release.sh install-chrome.sh
          sha256sum install-chrome.sh > install-chrome.sh.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: chrome-release-artifacts
          path: |
            clipmark-extension.zip
            clipmark-extension.zip.sha256
            plannotator-chrome-native-host-*
            install-chrome-native-host.sh
            install-chrome-native-host.sh.sha256
            install-chrome-extension.sh
            install-chrome-extension.sh.sha256
            install-chrome.sh
            install-chrome.sh.sha256

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/chrome-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "Chrome extension and native host release artifacts."
          fi
          gh release upload "$TAG_NAME" \
            clipmark-extension.zip \
            clipmark-extension.zip.sha256 \
            plannotator-chrome-native-host-* \
            install-chrome-native-host.sh \
            install-chrome-native-host.sh.sha256 \
            install-chrome-extension.sh \
            install-chrome-extension.sh.sha256 \
            install-chrome.sh \
            install-chrome.sh.sha256 \
            --clobber
