<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClipMark</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        background: Canvas;
        color: CanvasText;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 650;
      }

      .meta {
        margin: 0;
        color: color-mix(in srgb, CanvasText 68%, transparent);
        font-size: 12px;
        line-height: 1.4;
      }

      .status {
        margin: 10px 0 0;
        min-height: 18px;
        font-size: 12px;
        line-height: 1.4;
      }

      .error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <h1>ClipMark</h1>
    <p id="meta" class="meta">Reading clipboard...</p>
    <p id="status" class="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
